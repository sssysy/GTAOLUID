<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GTAOL 玩家详情</title>
<style>
  @font-face {
    font-family: 'youyuan';
    src: url('{{ font_uri }}') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  {{ css_content|safe }}
  .card {
    background-image:
      linear-gradient(rgba(10, 13, 19, 0.55), rgba(10, 13, 19, 0.60)),
      url('{{ bg_uri }}');
  }
</style>
</head>
<body>

<div class="card" id="capture-card">

  <div class="detail-header">
    <span class="detail-title">玩家详情</span>
    <span class="detail-count">共 {{ items|length }} 项</span>
  </div>

  <div class="kv-columns">
    {% for it in items %}
    <div class="kv-item">
      <div class="kv-lbl">{{ it.label }}</div>
      <div class="kv-val">{{ it.value }}</div>
    </div>
    {% endfor %}
  </div>

  <div class="card-footer">
    Create by <span class="footer-hl">GsCore</span> &amp; Power by <span class="footer-hl">GTAOLUID</span> &amp; Data by <span class="footer-hl">洛圣都Express</span>
  </div>

</div>

</body>
</html>
