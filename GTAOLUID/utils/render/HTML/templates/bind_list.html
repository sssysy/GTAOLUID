<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GTAOL 绑定账号列表</title>
<style>
  @font-face {
    font-family: 'youyuan';
    src: url('{{ font_uri }}') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  {{ css_content|safe }}
  .card {
    width: 400px;
    background-image:
      linear-gradient(rgba(10, 13, 19, 0.55), rgba(10, 13, 19, 0.60)),
      url('{{ bg_uri }}');
  }
</style>
</head>
<body>

<div class="card" id="capture-card">

  <!-- 1. 用户身份模块 -->
  <div class="mod-header">
    <div class="user-left">
      <img class="avatar" src="{{ user_avatar_src }}" alt="Avatar">
      <div class="user-details">
        <div class="user-name">{{ user_name }}</div>
        <div class="user-sub"><span>{{ user_id }}</span></div>
      </div>
    </div>
    <div class="header-right">
      <img class="plugin-icon" src="{{ icon_uri }}" alt="Icon">
    </div>
  </div>

  <!-- 2. 绑定账号卡片列表 -->
  <div class="accounts-container">
    {% for acc in accounts %}
    <div class="account-card">
      <img class="account-avatar" src="{{ acc.avatar_src }}" alt="Rockstar Avatar">
      <div class="account-info">
        <div class="account-name">{{ acc.name }}</div>
        <div class="account-id">Rockstar ID: {{ acc.rid }}</div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- 3. 底部注脚 -->
  <div class="card-footer">
    Create by <span class="footer-hl">GsCore</span> &amp; Power by <span class="footer-hl">GTAOLUID</span>
  </div>

</div>

</body>
</html>
